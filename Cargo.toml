[package]
name = "islam-cli"
version = "0.1.0"
edition = "2021"
description = "Read the Quran in your terminal"
license = "MIT"
repository = "https://github.com/HyperZx2O/qari-cli"

[[bin]]
name = "islam"
path = "src/main.rs"

[dependencies]
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
fuzzy-matcher = "0.3"
arboard = "3"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"
dirs = "5"

[profile.release]
opt-level = "z"
lto = true
strip = true

[profile.dist]
inherits = "release"
lto = "thin"
